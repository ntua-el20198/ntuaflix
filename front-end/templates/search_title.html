<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>
    <div class="nav2" id="nav2">
        <div class="nav2_logo_options">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" class="logo">
            <a href="{{ url_for('my_list') }}" class="nav2_option">My List</a>
            <a href="{{ url_for('signup_success') }}" class="nav2_option">Home</a>
            <a href="{{ url_for('search_title') }}" class="nav2_option">Search By Title</a>
            <a href="{{ url_for('search_genre') }}" class="nav2_option">Search By Genre</a>
            <a href="{{ url_for('search_name') }}" class="nav2_option">Search Principals</a>


        </div>

        <div class="nav2_avatar_search">

            <div class="dropdown">
                <img src="{{ url_for('static', filename='images/avatar.png') }}" alt="" class="nav2_avatar">
                <div class="dropdown_content">
                    <a href="{{ url_for('my_likes') }}" class="nav2_option">Likes</a>
                    <a href="{{ url_for('index') }}">Log Out</a>
                </div>
            </div>

        </div>
    </div>

    <div class="searchText">
        <p>Search By Title</p>
    </div>

    <form action="{{ url_for('searchTitle') }}" method="GET">
        <div class="searchBar">
            <input type="text" placeholder="Search..." class="middle-search-input" name="titlePart">
            <button type="submit" class="middle-search-button">Search</button>
        </div>
    </form>

    <div id="resultsContainer" class="movieResults"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const searchButton = document.querySelector('.middle-search-button');
            const searchInput = document.querySelector('.middle-search-input');
            const resultsContainer = document.getElementById('resultsContainer');

            searchButton.addEventListener('click', function () {
                event.preventDefault();
                const titlePart = searchInput.value.trim();
                
                const url = new URL('/searchTitle', window.location.origin);
                url.searchParams.append('titlePart', titlePart);
                
                const resultsContainer = document.getElementById('resultsContainer');
                fetch(url, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                })
                    .then(response => response.json())
                    .then(data => {
                        console.log(data);
                        displaySearchResults(data, resultsContainer);
                    })
                    .catch(error => {
                        console.error('Error:', error);
                    });

            });
        });
        
    </script>
    <script src="{{ url_for('static', filename='likesfunctions.js') }}"></script>
    <script src="{{ url_for('static', filename='mylistfunctions.js') }}"></script>
    <script src="{{ url_for('static', filename='displayresults.js') }}"></script>
</body>

</html>
